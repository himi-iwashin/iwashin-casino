<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071b32">
<meta name="description" content="イワシんと氷見のお魚で遊ぶ、スマホ対応のコインゲーム。">
<title>イワシんカジノ｜氷見の海で運だめし</title>
<style>
:root{color-scheme:dark;--navy:#071b32;--deep:#0b2945;--panel:#103655;--line:#2c5c77;--cream:#fff5d6;--muted:#b6d0dc;--cyan:#63e4df;--yellow:#ffd76a;--pink:#ff8e8a;--green:#a7f0c0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#1b5675 0,#0b2945 46%,#06182a 100%);color:var(--cream);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.shell{max-width:1040px;margin:auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #ffffff20;background:#071b32cc;border-radius:18px;padding:12px 16px;position:sticky;top:8px;z-index:3;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(18px,4vw,25px);letter-spacing:.03em}.mascot{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#9af2e9,#52b7ca);font-size:25px;box-shadow:0 0 22px #63e4df55}
.balance{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:14px;background:#173a54;font-weight:800;white-space:nowrap}.balance b{color:var(--yellow);font-size:19px}
.hero{text-align:center;padding:35px 12px 22px}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.16em;font-size:12px}.hero h1{font-size:clamp(30px,7vw,54px);line-height:1.12;margin:9px 0 8px;text-shadow:0 5px 24px #0005}.hero p{margin:0;color:var(--muted);font-size:15px}
.notice{max-width:690px;margin:0 auto 20px;padding:10px 14px;border:1px solid #63e4df50;border-radius:12px;color:#d6f3ee;background:#0e3446;font-size:12px;text-align:center}
.game-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 14px}
.tab{border:1px solid var(--line);border-radius:14px;background:#0d2b46;padding:12px 6px;font-weight:800;color:var(--muted);transition:.2s}.tab span{display:block;font-size:21px;margin-bottom:2px}.tab.active{background:linear-gradient(145deg,#1e6777,#14415f);color:white;border-color:var(--cyan);box-shadow:0 0 18px #63e4df20}
.panel{background:linear-gradient(155deg,#123957,#0c2945);border:1px solid #ffffff1a;border-radius:22px;padding:clamp(17px,4vw,30px);box-shadow:0 18px 50px #0003;min-height:365px}
.game-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:19px}.game-head h2{margin:0;font-size:24px}.game-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.tag{border:1px solid #47728a;background:#0b2945;border-radius:99px;padding:6px 10px;color:var(--cyan);font-size:12px;white-space:nowrap}
.section-label{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 9px}
.fish-picks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.fish-pick{border:1px solid var(--line);background:#0a2842;border-radius:14px;padding:12px 4px 10px;min-height:78px;font-weight:800;transition:.16s}.fish-pick .emoji{display:block;font-size:27px;margin-bottom:4px}.fish-pick.selected{border-color:var(--yellow);background:#4a482f;box-shadow:0 0 0 2px #ffd76a33}
.stakes{display:flex;gap:8px;flex-wrap:wrap}.stake{border:1px solid var(--line);border-radius:99px;background:#0b2945;padding:8px 15px;font-weight:800}.stake.selected{color:#1a2c36;background:var(--yellow);border-color:var(--yellow)}
.actions{display:flex;align-items:center;gap:12px;margin-top:19px;flex-wrap:wrap}.play{border:0;border-radius:13px;padding:12px 24px;color:#102b3d;font-weight:900;background:linear-gradient(120deg,#ffe48a,#ffc54e);box-shadow:0 5px 0 #b88931;transition:.12s}.play:hover{transform:translateY(-1px);filter:brightness(1.05)}.play:active{transform:translateY(2px);box-shadow:0 2px 0 #b88931}.play:disabled{opacity:.45;cursor:not-allowed;transform:none}.result{min-height:25px;color:var(--cyan);font-weight:800}.result.win{color:var(--yellow)}.result.lose{color:#ffaaa5}
.roulette-display{display:grid;place-items:center;min-height:115px;border:1px dashed #4c7990;border-radius:16px;background:#0a2942;margin-top:16px}.roulette-display .fish-result{font-size:46px;animation:pop .5s ease}.roulette-display small{display:block;color:var(--muted);margin-top:5px;text-align:center}
@keyframes pop{0%{transform:scale(.4) rotate(-15deg);opacity:0}80%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.slot-machine{display:flex;justify-content:center;gap:10px;padding:22px 10px;background:#09253e;border:1px solid var(--line);border-radius:18px}.reel{display:grid;place-items:center;width:min(22vw,92px);height:min(22vw,92px);font-size:clamp(36px,9vw,58px);background:linear-gradient(#f9eed3,#ded3b3);border-radius:15px;box-shadow:inset 0 4px 10px #5555,0 4px 0 #527086}
.card-table{display:flex;align-items:center;justify-content:center;gap:clamp(15px,5vw,54px);min-height:150px;background:radial-gradient(ellipse,#145b62,#0a293f 70%);border:1px solid #437c82;border-radius:18px}.playing-card{width:82px;height:112px;border-radius:12px;background:#fff8e8;color:#172f43;display:grid;place-items:center;font-size:31px;font-weight:900;box-shadow:0 8px 20px #0005;transform:rotate(-3deg)}.playing-card.right{transform:rotate(3deg)}.vs{font-weight:900;color:var(--yellow)}
.store-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.prize{border:1px solid var(--line);border-radius:16px;background:#0b2945;padding:16px 12px;text-align:center}.prize .emoji{font-size:36px}.prize h3{font-size:15px;margin:7px 0 4px}.prize p{font-size:12px;color:var(--muted);min-height:35px;margin:0 0 10px}.prize .cost{color:var(--yellow);font-weight:900}.prize button{display:block;margin:10px auto 0;border:1px solid #638397;border-radius:9px;background:#143b56;padding:7px 11px;font-size:12px}.prize button:disabled{opacity:.55;cursor:default}
footer{text-align:center;color:#90aebb;font-size:11px;padding:22px 10px 0}.reset{border:0;background:none;color:#7da0b2;text-decoration:underline;font-size:11px;margin-top:6px}
.modal-backdrop{position:fixed;inset:0;background:#02101dcc;display:grid;place-items:center;padding:18px;z-index:9}.modal{width:min(420px,100%);border:1px solid #5fa2ad;background:#103552;border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 70px #0008}.modal .emoji{font-size:40px}.modal h2{margin:6px 0}.modal p{color:var(--muted);line-height:1.7}.modal button{border:0;border-radius:11px;background:var(--yellow);color:#15344a;padding:10px 25px;font-weight:900}
@media(max-width:600px){.shell{padding:10px 11px 28px}header{padding:9px 11px;top:5px}.mascot{width:36px;height:36px;font-size:21px}.balance{padding:7px 9px;font-size:12px}.balance b{font-size:16px}.hero{padding:28px 5px 18px}.hero p{font-size:13px}.game-tabs{gap:6px}.tab{padding:9px 3px;font-size:12px;border-radius:11px}.tab span{font-size:19px}.panel{border-radius:18px;min-height:390px}.game-head h2{font-size:21px}.tag{font-size:10px;padding:5px 7px}.fish-picks{gap:5px}.fish-pick{font-size:11px;min-height:70px}.fish-pick .emoji{font-size:24px}.store-grid{grid-template-columns:1fr}.prize{display:grid;grid-template-columns:48px 1fr auto;align-items:center;text-align:left;gap:8px;padding:11px}.prize .emoji{font-size:29px;grid-row:span 3}.prize h3{margin:0}.prize p{min-height:0;margin:2px 0}.prize button{grid-column:3;grid-row:1/4;margin:0}.prize .cost{font-size:12px}.actions{gap:9px}.play{padding:11px 17px}.roulette-display{min-height:100px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* Iwashin-led casino and felt roulette */
:root{--felt:#08724c;--felt2:#064b36;--casino-gold:#f1cf76}
.brand .mascot{width:62px;height:48px;border-radius:14px;background:#d9f3ed;box-shadow:0 0 20px #8ce8d855;padding:3px}.brand .mascot svg{width:100%;height:100%}
.tab.active{background:linear-gradient(145deg,#b18438,#704d22);border-color:#f1cf76;color:#fff7dd;box-shadow:0 0 20px #f1cf7640}
.mascot-guide{display:flex;align-items:center;gap:14px;margin:12px 0 18px;padding:10px 16px;min-height:120px;border:1px solid #987d47;border-radius:18px;background:linear-gradient(110deg,#173e35,#0a2c27)}.mascot-guide .portrait{width:145px;min-width:110px;display:grid;place-items:center}.mascot-guide .bubble{font-weight:850;line-height:1.55}.mascot-guide small{display:block;color:#b7d2c5;font-weight:500;margin-top:4px}.iwasvg{width:100%;height:auto;filter:drop-shadow(0 5px 5px #0005)}.brand .mascot .iwasvg{width:100%;height:100%;object-fit:contain}.mascot-guide .portrait .iwasvg{max-height:130px;object-fit:contain}.wheel-center .iwasvg{width:100%;max-width:82px;max-height:82px;object-fit:contain}.dealer-mini .iwasvg{width:76px}.playing-card .iwasvg{max-width:100px;max-height:112px;object-fit:contain}

.roulette-floor{background:linear-gradient(135deg,#0a704b,#07543b);border:7px ridge #b79a59;border-radius:24px;padding:clamp(10px,2.5vw,22px);box-shadow:inset 0 0 0 2px #e5ca82,0 15px 30px #0005}.casino-stage{display:grid;grid-template-columns:minmax(230px,340px) 1fr;gap:clamp(12px,3vw,28px);align-items:center}.wheel-wrap{display:grid;justify-items:center;gap:9px}.wheel{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;position:relative;border:10px solid #c8a454;background:radial-gradient(circle at center,#12503a 0 23%,#8b6328 23.5% 26%,#102d25 26.5% 69%,#d8b869 69.5% 74%,#263c30 74.5%);box-shadow:inset 0 0 0 3px #f4db8d,0 6px 16px #001a12}.wheel:after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid #eed58b;pointer-events:none}.wheel.spin{animation:wheelspin 1.55s cubic-bezier(.12,.76,.12,1)}@keyframes wheelspin{to{transform:rotate(1440deg)}}.wheel-number{position:absolute;left:50%;top:50%;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;color:white;border:1px solid #eed58b}.wheel-center{position:absolute;inset:36%;border-radius:50%;display:grid;place-items:center;background:#d8b562;border:3px solid #f3dc9a;z-index:2;padding:8px}.wheel-center svg{max-width:82px}.wheel-caption{font-size:11px;color:#f4e7bb;text-align:center}.dealer-mini{display:flex;align-items:center;gap:8px;color:#fff3c8;font-weight:900;margin:0 0 10px}.dealer-mini svg{width:76px}.wheel-result{font-weight:950;text-align:center;min-height:42px;padding:9px;border-radius:12px;background:#063e2d;color:#f9df91;border:1px solid #af9b5a;margin:10px 0}.wheel-result b{font-size:24px}.roulette-layout{display:grid;grid-template-columns:44px repeat(12,minmax(24px,1fr));gap:3px}.zero-cell{grid-row:1/4;grid-column:1;background:#087d4e}.roulette-num,.zero-cell,.outside-bet,.dozen-bet{border:1px solid #d0bd75;border-radius:4px;min-height:34px;display:grid;place-items:center;font-weight:900;font-size:12px;position:relative}.roulette-num.red{background:#b83239}.roulette-num.black{background:#182526}.roulette-num.selected,.outside-bet.selected,.zero-cell.selected{outline:3px solid #ffe17b;z-index:1;box-shadow:0 0 13px #ffe17b}.chip-mark{position:absolute;right:-3px;top:-5px;border-radius:50%;background:#f8d978;color:#302719;min-width:17px;height:17px;padding:0 3px;font-size:9px;display:grid;place-items:center;border:1px solid #fff}.outside-row{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}.outside-bet{min-height:31px;background:#164e3b;color:#fff8dc;font-size:10px}.roulette-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:2px solid #c5a04a;border-radius:50%;width:43px;height:43px;background:#f2dc9a;color:#2e2a1d;font-size:11px;font-weight:950;box-shadow:inset 0 0 0 2px #fff2}.chip.selected{background:#e95451;color:white;border-color:#fff0bd;transform:translateY(-3px)}.bet-summary{font-size:12px;color:#fff2c1;font-weight:800}.clear-bets{border:1px solid #d4c37e;background:#104431;border-radius:9px;padding:8px 12px;font-weight:800}.wheel-instructions{font-size:11px;color:#e5dfc2;margin:7px 0 0}
.slot-guide{justify-content:space-around}.slot-guide .portrait{width:190px}.slot-guide .bubble{font-size:clamp(14px,2.7vw,18px)}
.card-table{min-height:210px;border:4px ridge #b79a59;background:radial-gradient(ellipse,#17654e,#0a332b 75%);border-radius:20px}.playing-card{width:clamp(92px,21vw,142px);height:clamp(132px,30vw,195px);border:3px solid white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:18px}.playing-card .card-rank{font-size:30px}.playing-card .card-art{width:72%;max-height:100px}.card-meta{font-size:11px;color:#5b5b42}.support-line{text-align:center;color:#d0e6d9;font-size:12px;margin:9px}
@media(max-width:720px){.casino-stage{grid-template-columns:1fr}.wheel{width:min(68vw,260px)}.roulette-layout{grid-template-columns:34px repeat(12,minmax(18px,1fr));gap:2px}.roulette-num,.zero-cell{font-size:10px;min-height:30px}.outside-bet{font-size:9px;min-height:28px}.mascot-guide{min-height:94px}.mascot-guide .portrait{width:105px;min-width:88px}.slot-guide .portrait{width:135px}.dealer-mini svg{width:62px}}@media(max-width:460px){.casino-stage{gap:14px}.wheel{width:min(72vw,240px)}.roulette-layout{grid-template-columns:28px repeat(12,minmax(17px,1fr))}.roulette-num,.zero-cell{font-size:9px}.outside-row{gap:2px}.chip{width:38px;height:38px}.slot-guide .portrait{width:105px}.slot-machine{padding:12px 4px}.card-table{min-height:170px}}

</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><span class="mascot" aria-hidden="true">🐟</span><span>イワシんカジノ</span></div><div class="balance" aria-live="polite">🪙 <span>コイン</span><b id="balance">500</b></div></header>
<section class="hero"><div class="eyebrow">HIMI FISHING FUN</div><h1>氷見の海で、運だめし！</h1><p>お魚ゲームでコインを集めよう</p></section>
<div class="notice">このゲームは遊び用コインのデモです。お金を賭けたり、コインを換金したりすることはできません。</div>
<nav class="game-tabs" aria-label="ゲーム選択">
<button class="tab active" data-view="roulette"><span>🎡</span>お魚ルーレット</button>
<button class="tab" data-view="slots"><span>🎰</span>フィッシュスロット</button>
<button class="tab" data-view="cards"><span>🃏</span>お魚カード</button>
<button class="tab" data-view="store"><span>🎁</span>景品コーナー</button>
</nav>
<main class="panel" id="panel"></main>
<footer>コインはこの端末のブラウザーに保存されます。ほかの端末への引き継ぎはできません。<br><button class="reset" id="reset">コインを初期化する</button></footer>
</div>
<div id="modal-root"></div>
<script>
const fish=[
 {name:"ブリ",emoji:"🐟"},{name:"イカ",emoji:"🦑"},{name:"カニ",emoji:"🦀"},{name:"ホタテ",emoji:"🐚"},{name:"フグ",emoji:"🐡"}
];
const prizes=[
 {emoji:"🐟",name:"イワシんステッカー",desc:"イワシんのワンポイントステッカー",cost:2500},
 {emoji:"🧲",name:"氷見のお魚マグネット",desc:"お魚モチーフのマグネット",cost:5000},
 {emoji:"🎁",name:"みりん干しセット",desc:"中村海産の人気商品セット",cost:10000}
];
const rawSaved=localStorage.getItem("iwashinCasinoCoins");
const parsedSaved=rawSaved===null?NaN:Number(rawSaved);
let coins=Number.isFinite(parsedSaved)&&parsedSaved>=0?parsedSaved:500;
let activeView="roulette",selectedFish=0,stake=25,slotTimer=null;
const panel=document.getElementById("panel");
function save(){localStorage.setItem("iwashinCasinoCoins",String(coins));document.getElementById("balance").textContent=coins.toLocaleString("ja-JP")}
function setResult(text,type=""){const e=document.getElementById("result");if(e){e.textContent=text;e.className="result "+type}}
function insufficient(){return coins<stake}
function stakeControls(){return '<div class="section-label">コインを選ぶ</div><div class="stakes">'+[10,25,50].map(n=>'<button class="stake '+(stake===n?'selected':'')+'" data-stake="'+n+'">'+n+' コイン</button>').join("")+'</div>'}
function renderRoulette(){
 panel.innerHTML='<div class="game-head"><div><h2>🎡 お魚ルーレット</h2><p>好きなお魚を選んで、出目を予想しよう</p></div><span class="tag">的中で 3 倍</span></div>'+
 '<div class="section-label">どのお魚にする？</div><div class="fish-picks">'+fish.map((f,i)=>'<button class="fish-pick '+(selectedFish===i?'selected':'')+'" data-fish="'+i+'"><span class="emoji">'+f.emoji+'</span>'+f.name+'</button>').join("")+'</div>'+
 stakeControls()+'<div class="actions"><button class="play" id="play" '+(insufficient()?'disabled':'')+'>ルーレットを回す</button><span id="result" class="result">当たるとコインが3倍！</span></div><div class="roulette-display" id="wheel"><div><div class="fish-result">🌊</div><small>氷見の海からお魚がやってくる！</small></div></div>';
}
function renderSlots(){panel.innerHTML='<div class="game-head"><div><h2>🎰 フィッシュスロット</h2><p>止めたいタイミングでボタンを押そう</p></div><span class="tag">3 個そろうと 10 倍</span></div>'+
 '<div class="slot-machine" aria-label="スロット"><div class="reel" id="r0">🐟</div><div class="reel" id="r1">🦑</div><div class="reel" id="r2">🦀</div></div>'+
 '<div class="actions"><button class="play" id="play" '+(coins<20?'disabled':'')+'>20コインで回す</button><span id="result" class="result">回転中に「停止」を押せます</span></div><div class="section-label">3つ揃いで200コイン、2つ揃いで40コイン獲得</div>'}
function renderCards(){panel.innerHTML='<div class="game-head"><div><h2>🃏 お魚ハイカード</h2><p>イワシんとカード勝負！数字が大きい方の勝ち</p></div><span class="tag">勝ったら 2 倍</span></div>'+
 '<div class="card-table"><div class="playing-card" id="player-card">🐟</div><div class="vs">VS</div><div class="playing-card right" id="house-card">🐡</div></div>'+
 '<div class="actions"><button class="play" id="play" '+(coins<25?'disabled':'')+'>25コインで勝負</button><span id="result" class="result">Aが一番強いカード！</span></div>'}
function renderStore(){panel.innerHTML='<div class="game-head"><div><h2>🎁 景品コーナー</h2><p>コインをためて、景品をチェックしよう</p></div><span class="tag">店頭交換の準備中</span></div>'+
 '<div class="store-grid">'+prizes.map(p=>'<article class="prize"><div class="emoji">'+p.emoji+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="cost">'+p.cost.toLocaleString('ja-JP')+' コイン</div><button disabled>交換受付は準備中</button></article>').join("")+'</div>'+
 '<div class="section-label">※ここは景品イメージの展示です。実際の交換はまだできません。</div>'}
function render(){save();if(activeView==="roulette")renderRoulette();if(activeView==="slots")renderSlots();if(activeView==="cards")renderCards();if(activeView==="store")renderStore()}
function changeView(view){activeView=view;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));render()}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>changeView(b.dataset.view)));
panel.addEventListener("click",e=>{
 const fs=e.target.closest("[data-fish]");if(fs){selectedFish=Number(fs.dataset.fish);render();return}
 const st=e.target.closest("[data-stake]");if(st){stake=Number(st.dataset.stake);render();return}
 if(e.target.id==="play"){if(activeView==="roulette")playRoulette();if(activeView==="slots"){if(slotTimer!==null)stopSlots();else playSlots()}if(activeView==="cards")playCards()}
});
function playRoulette(){
 if(coins<stake)return;coins-=stake;save();const btn=document.getElementById("play");btn.disabled=true;setResult("ルーレットが回転中…");
 const box=document.getElementById("wheel"),small=box.querySelector("small"),icon=box.querySelector(".fish-result");let ticks=0;
 const timer=setInterval(()=>{const f=fish[Math.floor(Math.random()*fish.length)];icon.textContent=f.emoji;small.textContent=f.name+" が通りすぎた…";ticks++;if(ticks>=12){clearInterval(timer);const result=fish[Math.floor(Math.random()*fish.length)];icon.textContent=result.emoji;small.textContent="出たのは「"+result.name+"」！";if(fish[selectedFish].name===result.name){const prize=stake*3;coins+=prize;setResult("的中！ "+prize+"コイン獲得！","win")}else setResult("はずれ…また挑戦してね","lose");save();btn.disabled=coins<stake}},75)
}
function settleSlots(ids){
 const counts=ids.reduce((a,n)=>(a[n]=(a[n]||0)+1,a),{}),max=Math.max(...Object.values(counts));

<script>
/* Blackjack payout follows 3:2; double down adds one stake and forces one card. */
const renderCardsBeforeDoubleDown=window.renderCards;
window.renderCards=function(){
  renderCardsBeforeDoubleDown();
  if(cardMode!=='blackjack')return;
  const rules=panel.querySelector('.section-label');
  if(rules)rules.textContent='大会ルール：ディーラーの1枚目だけ公開。あなたが勝負を選ぶまで伏せ札と合計は見えません。スタンド後に公開し、イワシんは17以上まで引きます。ブラックジャックは3:2配当です。';
  const actions=panel.querySelector('.actions');
  if(actions&&bjState&&!bjState.done&&bjState.p.length===2&&!bjState.doubleDown){
    const button=document.createElement('button');button.type='button';button.id='bj-double';button.className='play secondary';
    button.textContent='ダブルダウン（賭け金を倍に）';button.disabled=coins<(bjState.bet||25);
    button.setAttribute('aria-label','追加で同額を賭けてカードを1枚だけ引く');
    const stand=actions.querySelector('#bj-stand');actions.insertBefore(button,stand||null);
  }
};
const playCardsBeforeDoubleDown=window.playCards;
window.playCards=function(){const start=cardMode==='blackjack'&&(!bjState||bjState.done);playCardsBeforeDoubleDown();if(start&&bjState&&!bjState.done)bjState.bet=25};
finishBJ=function(){
  if(!bjState||bjState.done)return;const wager=bjState.bet||25,p=btotal(bjState.p),natural=bjState.p.length===2&&p===21&&!bjState.doubleDown;let d=btotal(bjState.d);
  if(p<=21&&!natural){while(d<17){bjState.d.push(bjState.deck.pop());d=btotal(bjState.d)}}const houseNatural=bjState.d.length===2&&btotal(bjState.d)===21;let payout=0,message;
  if(p>21){message='あなたのバースト。イワシんの勝ち！';cardDealerMessage='21をこえちゃったね。今回はイワシんの勝ち！'}
  else if(natural&&houseNatural){payout=wager;message='おたがいブラックジャック。引き分けで'+payout+'コイン返却！';cardDealerMessage='おたがいブラックジャック！引き分けだね。'}
  else if(houseNatural&&!natural){message='ディーラーがブラックジャック。イワシんの勝ち！';cardDealerMessage='ブラックジャックだ！今回はイワシんの勝ちだよ。'}
  else if(natural){payout=Math.round(wager*2.5);message='ブラックジャック！3:2配当、'+payout+'コイン払い戻し！';cardDealerMessage='ブラックジャック！3:2配当だよ。お見事！'}
  else if(d>21||p>d){payout=wager*2;message=d>21?'イワシんがバースト！'+payout+'コイン払い戻し！':'勝ち！'+payout+'コイン払い戻し！';cardDealerMessage='やったね！今回はあなたの勝ちだよ！'}
  else if(p===d){payout=wager;message='引き分け。'+payout+'コイン返却！';cardDealerMessage='同じ点数だね。引き分け！'}
  else{message='イワシんの勝ち！';cardDealerMessage='イワシんの勝ち！また挑戦してね！'}

function bingoSetup(){const mk=()=>{const cols=Array.from({length:5},(_,c)=>shuffle(Array.from({length:15},(_,i)=>c*15+i+1)).slice(0,5));return Array.from({length:5},(_,r)=>Array.from({length:5},(_,c)=>c===2&&r===2?0:cols[c][r]))};return Array.from({length:10},mk)}

function diceRoll(n){if(!game||game.done)return;let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),sum=a+b,pay=0;if(n===sum)pay=180;else if(n==='low'&&sum<=6||n==='high'&&sum>=8)pay=50;game.done=true;game.dice=[a,b];game.msg='出目 '+a+'＋'+b+'＝'+sum+'。'+(pay?'的中！ '+pay+'コイン払い戻し！':'はずれ。イワシんの勝ち！');coins+=pay;save();draw()}
function draw(){if(activeView!=='minigames')return;let g=game,body='',title=kinds.find(x=>x[0]===kind)[1];if(kind==='bingo'&&!g){body=bingoSetupHTML()}else if(!g){body=(kind==='baccarat'?'<div class="mini-actions"><button class="mini-card-btn" data-bet="player">プレイヤー</button><button class="mini-card-btn" data-bet="banker">バンカー</button><button class="mini-card-btn" data-bet="tie">引き分け</button></div>':'')+talk(kind==='baccarat'?'25コインを賭けるよ。どちらが勝つかな？':kind==='sevens'?'7を起点に数字をつなごう。':kind==='memory'?'同じスタンプのペアを探してね。':kind==='speed'?'中央のカードに続く数字を出そう。':kind==='daifugo'?'手札を早くなくそう。今回は分かりやすい1枚出しルール。':'合計を予想。2〜6または8〜12で50コイン、数字ぴったりで180コイン払い戻し！')+'<div class="mini-actions"><button class="play" id="mini-start">25コインで開始</button></div>'}else if(kind==='bingo'){let cards=g.cards.map((c,p)=>'<div><b>プレイヤー'+(p+1)+'　'+lines(c,g.draws).length+'ライン</b><div class="mini-grid">'+c.flat().map(n=>'<div class="mini-cell '+(!n?'free':'')+' '+(n===0||g.draws.includes(n)?'hit':'')+'">'+(n||'イワシん')+'</div>').join('')+'</div></div>').join('');body=talk(g.msg)+'<div class="mini-center">引いた数字 '+g.draws.length+'／'+(g.mode==='one'?35:40)+'　今回 '+(g.draws.at(-1)||'—')+'</div>'+cards+'<div class="mini-actions"><button class="play" id="mini-next" '+(g.over?'disabled':'')+'>次の数字</button><button class="mini-card-btn" id="mini-again">もう一度</button></div>'}else if(kind==='baccarat'){body=talk(g.msg)+'<div class="mini-table"><div>プレイヤー '+g.cards[0].map(c=>cardFace(c)).join('　')+'</div><div class="mini-center">VS</div><div>バンカー（イワシん） '+g.cards[1].map(c=>cardFace(c)).join('　')+'</div></div><button class="play" id="mini-again">もう一度</button>'}else if(kind==='sevens'){body=talk(g.msg)+'<div class="mini-table"><div>場（7を起点）</div>'+g.board.map((s,i)=>'<div>'+['♠','♥','♦','♣'][i]+'：'+Array.from({length:13},(_,j)=>s[j+1]?'●':j+1===7?'7':'·').join(' ')+'</div>').join('')+'<div class="mini-cards">'+g.hands[0].map(c=>'<button class="mini-card-btn" data-seven="'+c.r+'-'+c.s+'">'+cardFace(c)+'</button>').join('')+'</div><button class="mini-card-btn" id="mini-pass">パス</button></div>'}else if(kind==='memory'){body=talk(g.msg)+'<div class="mini-center">あなた '+g.you+'組　／　イワシん '+g.cpu+'組</div><div class="mini-grid">'+g.faces.map((f,i)=>'<button class="mini-cell '+(g.picked.includes(i)?'hit':'')+'" data-memory="'+i+'">'+(f?(g.picked.includes(i)?f:'❔'):'✓')+'</button>').join('')+'</div>'}else if(kind==='speed'){body=talk(g.msg)+'<div class="mini-table"><div class="mini-cards">'+g.hand.map(c=>'<button class="mini-card-btn" data-speed="'+c.r+'-'+c.s+'">'+cardFace(c)+'</button>').join('')+'</div><div class="mini-center">場札 '+cardFace(g.center)+'</div><div>イワシんの残り '+g.cpu.length+'枚</div></div>'}else if(kind==='daifugo'){body=talk(g.msg)+'<div class="mini-table"><div class="mini-center">場札 '+(g.top?cardFace(g.top):'なし')+'</div><div class="mini-cards">'+g.hands[0].map(c=>'<button class="mini-card-btn" data-dai="'+c.r+'-'+c.s+'">'+cardFace(c)+'</button>').join('')+'</div><button class="mini-card-btn" id="mini-pass">パス</button></div>'}else if(kind==='dice'){body=talk(g.msg)+(g.done?'<div class="mini-dice">🎲 '+g.dice.join('　🎲 ')+'</div>':'<div class="mini-actions">'+Array.from({length:11},(_,i)=>'<button class="mini-card-btn" data-dice="'+(i+2)+'">'+(i+2)+'</button>').join('')+'</div><div class="mini-actions"><button class="mini-card-btn" data-dice="low">2〜6</button><button class="mini-card-btn" data-dice="high">8〜12</button></div>')+(g.done?'<button class="play" id="mini-again">もう一度</button>':'')}
panel.innerHTML='<div class="game-head"><div><h2>'+title+'</h2><p>イワシんディーラーと遊ぼう</p></div><span class="tag">所持 '+coins+'コイン</span></div>'+menu()+'<div class="mini-table">'+body+'</div>';}
const baseRender=render;render=function(){if(activeView==='minigames'){draw();return}baseRender()};

draw();
})();
